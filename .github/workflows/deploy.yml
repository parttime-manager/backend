name: Deploy

# main 푸시 시 빌드·테스트 후 EC2에 ptmanager.jar 을 배포한다.
# 서버 초기 설정(systemd, /etc/ptmanager.env)은 docs/deploy.md 를 따른다.
# 필요한 저장소 시크릿: EC2_HOST, EC2_USER, EC2_SSH_KEY, EC2_KNOWN_HOSTS
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build & test
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload jar
        run: |
          scp -i ~/.ssh/deploy_key build/libs/ptmanager.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/ptmanager.jar"

      # 배포 블록은 docs/deploy.md 의 수동 절차와 동일하다. 헬스체크가 실패하면 잡을 실패시키고 로그를 남긴다.
      - name: Restart & health check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'DEPLOY'
          set -e
          test -s "$HOME/ptmanager.jar"
          sudo systemctl stop ptmanager
          sudo install -o ptmanager -g ptmanager -m 0644 "$HOME/ptmanager.jar" /opt/ptmanager/ptmanager.jar
          sudo systemctl start ptmanager
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then exit 0; fi
            sleep 5
          done
          sudo journalctl -u ptmanager -n 100 --no-pager
          exit 1
          DEPLOY
